<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - OmniVids</title>
    <style>
        :root { --bg: #0f172a; --text: #f1f5f9; --text-muted: #94a3b8; --primary: #0070f3; --secondary: #a855f7; --card-bg: #1e293b; }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; text-align: center; }
        header { padding: 20px; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.5rem; font-weight: 800; text-decoration: none; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        main { flex: 1; padding: 60px 5%; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p.subtitle { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 40px; }
        .card { background: var(--card-bg); border: 1px solid #334155; border-radius: 16px; padding: 40px; }
        .card h2 { margin-top: 0; font-size: 1.2rem; color: var(--text-muted); font-weight: normal; }
        .email-link { display: inline-block; font-size: 1.4rem; font-weight: bold; color: white; text-decoration: none; margin: 10px 0 20px 0; padding: 12px 24px; background: var(--primary); border-radius: 8px; transition: background 0.2s; }
        .email-link:hover { background: var(--secondary); }
        .response-note { color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }
        footer { padding: 30px; border-top: 1px solid #334155; margin-top: auto; color: var(--text-muted); }
        footer a { color: var(--text-muted); text-decoration: none; margin: 0 10px; }
        footer a:hover { color: white; }
    </style>
</head>
<body>
    <header><a href="/" class="logo">OmniVids</a></header>
    <main>
        <h1>Get in Touch</h1>
        <p class="subtitle">Questions, support requests, or business inquiries — we're happy to help.</p>
        <div class="card">
            <h2>Email us directly</h2>
            <a href="mailto:support@tristar-labs.com" class="email-link">support@tristar-labs.com</a>
            <p class="response-note">We typically respond within 24-48 hours.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Tristar Labs. All rights reserved.</p>
        <a href="/">Home</a> | <a href="/pricing.html">Pricing</a> | <a href="/terms.html">Terms</a> | <a href="/privacy.html">Privacy</a> | <a href="/refund.html">Refund</a>
    </footer>
</body>
</html>
